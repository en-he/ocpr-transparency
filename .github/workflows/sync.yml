name: Contract Sync

on:
  schedule:
    # Weekly official bulk-CSV refresh — Sunday 3 AM AST (7 AM UTC)
    - cron: '0 7 * * 0'
    # Monthly audit rebuild — 2nd day of month 4 AM AST (8 AM UTC)
    - cron: '0 8 2 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly-audit
          - full-rebuild

concurrency:
  group: contract-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    env:
      FULL_DB_RELEASE_TAG: data-latest
      FULL_DB_RELEASE_ASSET: contratos-full.db.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Validate repository baseline
        working-directory: .
        run: |
          python pipeline/check_repository_portability.py
          python -m py_compile pipeline/*.py tests/*.py
          python -m unittest discover -s tests
          python pipeline/generate_bulk_certification.py --check

      - name: Hydrate full DB from release asset when needed
        id: hydrate
        if: github.event.inputs.mode != 'full-rebuild'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/db

          if [ -f data/db/contratos.db ]; then
            echo "bootstrap=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -f data/db/contratos-full.db.gz ]; then
            gzip -dc data/db/contratos-full.db.gz > data/db/contratos.db
            echo "bootstrap=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if gh release download "$FULL_DB_RELEASE_TAG" \
            --pattern "$FULL_DB_RELEASE_ASSET" \
            --dir data/db; then
            gzip -dc "data/db/$FULL_DB_RELEASE_ASSET" > data/db/contratos.db
            echo "bootstrap=false" >> $GITHUB_OUTPUT
          else
            echo "bootstrap=true" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap full DB from archived CSVs
        if: steps.hydrate.outputs.bootstrap == 'true'
        working-directory: pipeline
        run: python ingest.py --reset

      - name: Record full DB hash before sync
        id: db_before
        run: |
          if [ -f data/db/contratos.db ]; then
            echo "hash=$(sha256sum data/db/contratos.db | cut -d' ' -f1)" >> $GITHUB_OUTPUT
          else
            echo "hash=missing" >> $GITHUB_OUTPUT
          fi

      - name: Determine sync mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 7 * * 0" ]; then
            echo "mode=weekly" >> $GITHUB_OUTPUT
          else
            echo "mode=monthly-audit" >> $GITHUB_OUTPUT
          fi

      - name: Compute sync stamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # ── Weekly — refresh newer official bulk CSV years ───────────────
      - name: Weekly — bounded discovery, capture, and promotion
        if: steps.mode.outputs.mode == 'weekly'
        working-directory: pipeline
        run: python download.py --refresh-live --force

      - name: Weekly — certify promoted snapshots
        if: steps.mode.outputs.mode == 'weekly'
        run: |
          python pipeline/generate_bulk_certification.py
          python pipeline/generate_bulk_certification.py --check

      - name: Weekly — detect raw CSV changes
        id: weekly_raw_changes
        if: steps.mode.outputs.mode == 'weekly'
        run: |
          if [ -n "$(git status --porcelain -- data/raw)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Weekly — reset and re-ingest tracked sources
        if: steps.mode.outputs.mode == 'weekly' && steps.weekly_raw_changes.outputs.changed == 'true'
        working-directory: pipeline
        run: python ingest.py --reset

      # ── Monthly audit rebuild ────────────────────────────────────────
      - name: Monthly audit — reset and ingest tracked sources
        if: steps.mode.outputs.mode == 'monthly-audit'
        working-directory: pipeline
        run: python ingest.py --reset

      # ── Full rebuild (manual) ────────────────────────────────────────
      - name: Full rebuild — bounded discovery, capture, and promotion
        if: steps.mode.outputs.mode == 'full-rebuild'
        working-directory: pipeline
        run: python download.py --force

      - name: Full rebuild — certify promoted snapshots
        if: steps.mode.outputs.mode == 'full-rebuild'
        run: |
          python pipeline/generate_bulk_certification.py
          python pipeline/generate_bulk_certification.py --check

      - name: Full rebuild — reset and ingest
        if: steps.mode.outputs.mode == 'full-rebuild'
        working-directory: pipeline
        run: python ingest.py --reset

      - name: Validate post-sync publication gate
        run: |
          python pipeline/generate_bulk_certification.py --check
          python -m unittest discover -s tests
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          database = Path("data/db/contratos.db")
          if not database.is_file():
              raise SystemExit("publication gate: full database is missing")
          with sqlite3.connect(database) as connection:
              result = connection.execute("PRAGMA integrity_check").fetchone()
          if result != ("ok",):
              raise SystemExit(f"publication gate: SQLite integrity failed: {result!r}")
          print("publication gate: certification, tests, and SQLite integrity passed")
          PY

      - name: Detect whether browser artifacts need rebuild
        id: artifacts
        run: |
          if [ -f data/db/contratos.db ]; then
            after_hash=$(sha256sum data/db/contratos.db | cut -d' ' -f1)
          else
            after_hash=missing
          fi
          echo "after_hash=$after_hash" >> $GITHUB_OUTPUT

          if [ "${{ steps.mode.outputs.mode }}" = "monthly-audit" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.mode.outputs.mode }}" = "full-rebuild" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.hydrate.outputs.bootstrap }}" = "true" ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
          elif [ ! -f site/data-manifest.json ]; then
            echo "rebuild=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.db_before.outputs.hash }}" = "$after_hash" ]; then
            echo "rebuild=false" >> $GITHUB_OUTPUT
          else
            echo "rebuild=true" >> $GITHUB_OUTPUT
          fi

      # ── Build site assets ────────────────────────────────────────────
      - name: Build browser DB + manifest
        if: steps.artifacts.outputs.rebuild == 'true'
        run: >
          python pipeline/build_site_artifacts.py
          --repo-raw-base https://github.com/${{ github.repository }}/raw/main
          --full-download-url https://github.com/${{ github.repository }}/releases/download/${{ env.FULL_DB_RELEASE_TAG }}/${{ env.FULL_DB_RELEASE_ASSET }}

      # ── Commit changes ───────────────────────────────────────────────
      - name: Commit updated data
        id: auto_commit
        env:
          COMMIT_MESSAGE: "data: ${{ steps.mode.outputs.mode }} sync ${{ steps.stamp.outputs.date }}"
        run: |
          set -euo pipefail
          paths=()
          add_if_present_or_tracked() {
            local path="$1"
            if [ -e "$path" ] || [ -n "$(git ls-files "$path" "$path/**")" ]; then
              paths+=("$path")
            fi
          }

          add_if_present_or_tracked "data/raw"
          add_if_present_or_tracked "data/evidence/bulk"
          add_if_present_or_tracked "data/certification"
          add_if_present_or_tracked "data/db/monitor_state.json"
          add_if_present_or_tracked "site/data-manifest.json"
          while IFS= read -r artifact; do
            paths+=("$artifact")
          done < <(
            {
              git ls-files 'site/contratos.db.gz*'
              compgen -G 'site/contratos.db.gz*' || true
            } | sort -u
          )

          if [ "${#paths[@]}" -eq 0 ]; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          git push origin HEAD:main
          echo "changes_detected=true" >> "$GITHUB_OUTPUT"

      - name: Publish full DB release asset
        if: steps.artifacts.outputs.rebuild == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$FULL_DB_RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$FULL_DB_RELEASE_TAG" \
              --title "Latest data" \
              --notes "Automated full SQLite database for OCPR Transparency."

          gh release upload "$FULL_DB_RELEASE_TAG" "data/db/$FULL_DB_RELEASE_ASSET" --clobber
          gh release edit "$FULL_DB_RELEASE_TAG" --draft=false

      - name: Dispatch Pages deployment
        if: steps.auto_commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if gh workflow run pages.yml --ref main; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Pages dispatch attempt $attempt failed; retrying." >&2
              sleep "$((attempt * 10))"
            fi
          done

          echo "Pages dispatch failed after 3 attempts; dispatch pages.yml on main manually." >&2
          exit 1

      - name: Retain failed capture diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-capture-diagnostics-${{ github.run_id }}
          path: |
            data/quarantine/bulk
            data/evidence/bulk
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify failed sync review
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Contract Sync review required"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REQUESTED_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          issue_number="$(
            gh issue list --state open --search 'in:title "Contract Sync review required"' \
              --limit 100 --json number,title \
              --jq '[.[] | select(.title == "Contract Sync review required")][0].number // empty'
          )"
          if [ -n "$REQUESTED_MODE" ]; then
            mode="$REQUESTED_MODE"
          elif [ "$SCHEDULE" = "0 7 * * 0" ]; then
            mode="weekly"
          elif [ "$SCHEDULE" = "0 8 2 * *" ]; then
            mode="monthly-audit"
          else
            mode="unknown"
          fi
          body="$(printf '%s\n' \
            'A Contract Sync run failed and requires review.' \
            '' \
            "- Run: $RUN_URL" \
            "- Mode: $mode" \
            "- Event: $EVENT" \
            "- Source revision: $SHA" \
            '' \
            'The workflow did not complete the publication chain. Inspect retained bulk-capture diagnostics when present, classify schema/payload/endpoint drift, and close this issue only after the exception is resolved.')"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
